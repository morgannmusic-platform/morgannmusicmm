<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Morgann Music - Site Officiel</title>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="/assets/img/Icons/apple-touch-icon.png">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f4f8">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/footer/footer.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://morgannmusic.uk/#organization",
          "name": "Morgann Music Platforms",
          "url": "https://morgannmusic.uk"
        },
        {
          "@type": "MusicGroup",
          "@id": "https://morgannmusic.uk/#artist",
          "name": "Morgann Music",
          "alternateName": "Morgann Rachedi",
          "url": "https://morgannmusic.uk",
          "memberOf": {
            "@id": "https://morgannmusic.uk/#organization"
          },
          "genre": ["Instrumental", "Music"],
          "sameAs": [
            "https://music.apple.com/fr/artist/morgann-music/1820890727",
            "https://open.spotify.com/intl-fr/artist/0WJlJdaavSKPNoCSSHb8OC",
            "https://www.youtube.com/@Morgann.Music_m",
            "https://www.tiktok.com/@morgannmusic"
          ]
        },
        {
          "@type": "Person",
          "@id": "https://morgannmusic.uk/#person",
          "name": "Morgann Rachedi",
          "alternateName": "Morgann Music",
          "url": "https://morgannmusic.uk",
          "birthPlace": {
            "@type": "Place",
            "name": "Vienne, France"
          },
          "homeLocation": {
            "@type": "Place",
            "name": "Condrieu, France"
          }
        }
      ]
    }
    </script>
</head>

<body>
    <div id="navbar-container"></div>
    <script src="assets/js/navbar.js"></script>

    <header class="hero-header">
        <div class="hero-content">
            <div class="logo-wrapper">
                <img src="logoam.png" alt="Morgann Music Logo" class="main-logo">
            </div>
            <p id="artist-description" class="artist-desc">Chargement des informations...</p>
        </div>
    </header>

    <section class="release-section" id="last-release-section">
        <div class="section-container">
            <div class="release-card">
                <div class="cover-wrapper" id="last-cover-container">
                    <img id="last-cover" src="" alt="Pochette dernière sortie" class="hidden">
                    <video id="last-motion" autoplay loop muted playsinline preload="metadata" class="hidden"></video>
                    <div id="last-cover-skeleton" class="skeleton cover-skeleton"></div>
                </div>
                <div class="release-details">
                    <span class="status-tag tag-last">Dernière Sortie</span>
                    <h2 id="last-title" class="loading-text">--</h2>
                    <h3 id="last-artist" class="loading-text">--</h3>
                    <p class="release-subtext">Disponible dès maintenant sur vos plateformes d'écoute.</p>
                    <div class="buttons-group" id="last-links">
                        <a href="#" target="_blank" id="last-spotify" class="btn btn-spotify hidden"><i
                                class="fa-brands fa-spotify"></i> Spotify</a>
                        <a href="#" target="_blank" id="last-apple" class="btn btn-apple hidden"><i
                                class="fa-brands fa-apple"></i> Apple Music</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="release-section" id="next-release-section">
        <div class="section-container">
            <div class="release-card reverse">
                <div class="cover-wrapper" id="next-cover-container">
                    <img id="next-cover" src="" alt="Pochette prochaine sortie" class="hidden">
                    <video id="next-motion" autoplay loop muted playsinline preload="metadata" class="hidden"></video>
                    <div id="next-cover-skeleton" class="skeleton cover-skeleton"></div>
                </div>
                <div class="release-details">
                    <div class="date-badge hidden" id="next-date-box">
                        <span class="date-day" id="next-day">--</span>
                        <div class="date-month-year">
                            <span class="date-month" id="next-month">--</span>
                            <span class="date-year" id="next-year">--</span>
                        </div>
                    </div>
                    <h2 id="next-title" class="loading-text">--</h2>
                    <h3 id="next-artist" class="loading-text">--</h3>
                    <p class="release-subtext">Projet à venir. Bloquez la date sur votre calendrier !</p>
                    <div class="buttons-group">
                        <a id="next-gcal" href="#" target="_blank" class="btn btn-calendar hidden"><i
                                class="fa-brands fa-google"></i> Google Calendar</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>
    <script src="assets/js/footer.js"></script>
    <script src="index.js"></script>
</body>

</html>
